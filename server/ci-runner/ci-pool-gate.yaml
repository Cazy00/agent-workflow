# Profile for a pool gate container (ci-pool, MAINT-0017 D1): git and gh only, so no nesting and no intercepts.
# `ci-pool check-profiles` refuses a profile with any other key or device.
# Create with: lxc profile create ci-pool-gate && lxc profile edit ci-pool-gate < ci-pool-gate.yaml
name: ci-pool-gate
description: ci-pool gate container (git and gh)
config:
  security.privileged: "false"
  limits.cpu: "2"
  limits.memory: 2GiB
  limits.memory.enforce: hard
  limits.memory.swap: "false"
devices:
  root:
    type: disk
    path: /
    pool: ci
  eth0:
    type: nic
    name: eth0
    network: lxdbr0
