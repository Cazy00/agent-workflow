# The workflow's check on every pull request, reported as `wf ci`. Installed by the workflow's bin/wf-adopt;
# make `wf ci` a required status check when the repository has rulesets (bin/wf-protect does). A change to this
# file is a workflow change.
#
# It never runs the pull request's own launcher or pin. The validator comes from the workflow repository (without a
# token when it is public; with the secret WF_READ_TOKEN when it is private, MAINT-0017) at the revision pinned in the
# *base* branch's docs/workflow/config.json, fetched fresh outside the checkout, and judges the pull request's head
# against that base, so the pin a pull request carries cannot choose the code that judges it. A pull request does run
# its own copy of this file, though, and could add another job named `wf ci`: only code-owner review of `.github/`
# (enforced mode) protects against that; in owner-merge mode the owner checks every change under `.github/`
# before merging. It runs with a read-only token, and no secret but WF_READ_TOKEN, which only the fetch step uses (any
# account that can push can read it). In enforced and owner-merge modes it runs the integration gate (`wf ci`), which
# needs the agent's delivery evidence for a production change: it reads it from the pull request description, so
# editing the description reruns this check on the same head: push the head, let its CI finish, then write the evidence. The run on
# the push fails ("evidence missing") and the rerun supersedes it, which is harmless where the merge route judges each check by its
# latest run; where a merge route still counts superseded runs, an empty commit after the evidence remains the fallback. In manual mode the owner's signed receipts are checked on the owner's machine
# (`wf closeout`), so here it checks the records only.
# Under owner-merge with approval.auto_merge (MAINT-0016) the agent turns on auto-merge for the pull requests `wf ci` leaves
# to it; this check also runs when auto-merge is turned on or off, and fails a pull request the owner merges that has it on
# while its checks still run, so GitHub cannot merge it on the other checks alone. Turned on after every check has passed,
# auto-merge merges at once: that rests on the agent keeping the rule (procedures/approval-evidence.md).
name: wf
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, auto_merge_enabled, auto_merge_disabled]
permissions:
  contents: read
concurrency:
  group: wf-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: wf ci
    # GitHub's runner unless the pull request is into __TRUSTED_BRANCH__ and the repository variable WF_GATE is `on`:
    # then the project's gate runner, labelled `wf-gate` (MAINT-0017, server/ci-runner), a container with no Docker and
    # no sudo, apart from the project's tests and deploys. The label is fixed here, because any write collaborator can
    # set a variable; the variable only switches the gate on or off. Only pull requests into the trusted branch, because the validator comes from the base
    # branch's pin and any other branch could pin its own. The gate is persistent: there this check is only as
    # trustworthy as the accounts that can change workflow files or the trusted branch, which in owner-merge and manual
    # modes means any account with write access, until each job gets a fresh container (D1).
    runs-on: ${{ github.event.pull_request.base.ref == '__TRUSTED_BRANCH__' && vars.WF_GATE == 'on' && 'wf-gate' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Refuse, on the gate, a pull request into any branch but exactly the trusted one
        # GitHub compares strings ignoring case, so `runs-on` also sends a pull request into a branch named `MAIN` to the
        # gate. Checked exactly here, before anything is checked out or fetched (MAINT-0017 v2.5.1 review); a token
        # without the Workflows permission cannot remove this step. On GitHub's runner it is skipped.
        if: github.event.pull_request.base.ref == '__TRUSTED_BRANCH__' && vars.WF_GATE == 'on'
        run: '[ "$GITHUB_BASE_REF" = "__TRUSTED_BRANCH__" ] || { echo "::error::wf ci on the gate is only for pull requests into __TRUSTED_BRANCH__."; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the gate diffs the base against the head and checks the head contains the base
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Fetch the validator pinned by the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # A private workflow repository needs a read-only token for it in this secret (MAINT-0017); unset, the fetch
          # is anonymous.
          WF_READ_TOKEN: ${{ secrets.WF_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$WF_READ_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WF_READ_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_VALUE_0
          fi
          git show "$BASE:docs/workflow/config.json" > "$RUNNER_TEMP/config.json"
          pin="$(node -e '
            const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const w = c.workflow ?? {};
            if (!/^[\w.-]+\/[\w.-]+$/.test(w.repo ?? "") || !/^[0-9a-f]{40}$|^[0-9a-f]{64}$/.test(w.revision ?? "")) { console.error("wf: the base config needs workflow.repo and a full workflow.revision"); process.exit(2); }
            console.log(w.repo, w.revision, c.approval?.label ?? "manual")' "$RUNNER_TEMP/config.json")"
          read -r REPO REV LABEL <<< "$pin"
          git init -q "$RUNNER_TEMP/wf"
          git -C "$RUNNER_TEMP/wf" fetch -q --depth 1 "https://github.com/$REPO.git" "$REV"
          git -C "$RUNNER_TEMP/wf" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$RUNNER_TEMP/wf" rev-parse HEAD)" = "$REV" ] || { echo "wf: fetched validator is not at $REV" >&2; exit 2; }
          echo "WF_LABEL=$LABEL" >> "$GITHUB_ENV"
      - name: Run the gate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          # Untrusted text: passed through the environment into a file, never into the script itself.
          DESCRIPTION: ${{ github.event.pull_request.body }}
          # Whether auto-merge is on (MAINT-0016): an environment value, which an older pinned validator ignores.
          WF_PR_AUTO_MERGE: ${{ github.event.pull_request.auto_merge && 'on' || 'off' }}
        run: |
          set -euo pipefail
          wf() { node "$RUNNER_TEMP/wf/validator/cli.js" --repo "$GITHUB_WORKSPACE" "$@"; }
          if [ "$WF_LABEL" = manual ]; then
            echo "manual mode: checking the records; the owner's receipts are checked by wf closeout"
            wf records --candidate "$HEAD_SHA"
          else
            # The task comes from the branch name (T-0001-…, codex/T-0001-…, claude/T-0001-…); the delivery evidence
            # from the description's marked block (procedures/execute.md *Checkpoints and task records*).
            printf '%s' "$DESCRIPTION" > "$RUNNER_TEMP/pr-description.md"
            code=0
            wf ci --baseline "$BASE" --candidate "$HEAD_SHA" --branch "$HEAD_REF" --delivery-evidence "$RUNNER_TEMP/pr-description.md" > "$RUNNER_TEMP/ci.json" || code=$?
            cat "$RUNNER_TEMP/ci.json"
            # Who merges, and why, on the run's summary and as a notice beside the check (owner-merge mode).
            node -e '
              const fs = require("fs");
              let r;
              try { r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### wf ci could not run\nIts reason is in the log.\n"); process.exit(0); }
              const fails = r.verdict === "fail" ? r.findings.filter(f => !/^(?:(?:planning|production|governing|enforcement|generated|unclassified): |unverified: |note: )/.test(f)) : [];
              const lines = [`### wf ci: ${r.verdict}`, ...fails.map(f => `- ${f.trim()}`)];
              if (r.records_only) lines.push("**Records only:** a project's own CI may skip its product jobs (procedures/delivery.md).");
              if (r.merge === "agent") lines.push("**Merge:** the agent may merge this once every required check has passed.");
              if (r.merge === "owner") { lines.push("**Merge:** the owner.", ...r.owner_reasons.map(x => `- ${x}`)); console.log(`::notice title=The owner merges this::${r.owner_reasons.join("; ").replace(/[\r\n%]/g, " ")}`); }
              if (r.deferred?.length) lines.push("**For the owner at the milestone’s acceptance:**", ...r.deferred.map(x => `- ${x}`));
              if (r.workflow) lines.push(`Judged by agent-workflow ${r.workflow.version ?? ""} (${String(r.workflow.revision ?? "").slice(0, 12)}), the base branch’s pin.`);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            ' "$RUNNER_TEMP/ci.json" || true
            exit "$code"
          fi
