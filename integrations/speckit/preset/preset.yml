      },
      {
        "type": "command",
        "name": "speckit.checklist",
        "file": "commands/unsupported.md",
        "description": "Native workflow checklist boundary",
        "replaces": "speckit.checklist"
      },
      {
        "type": "command",
        "name": "speckit.converge",
        "file": "commands/unsupported.md",
        "description": "Native workflow converge boundary",
        "replaces": "speckit.converge"
      },
      {
        "type": "command",
        "name": "speckit.taskstoissues",
        "file": "commands/unsupported.md",
        "description": "Native workflow taskstoissues boundary",
        "replaces": "speckit.taskstoissues"
      },
      {
        "type": "template",
        "name": "constitution-template",
        "file": "templates/constitution-template.md",
        "description": "Pointer to native policy authority",
        "replaces": "constitution-template"
      }
