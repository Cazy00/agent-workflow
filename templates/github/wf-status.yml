# Project status on GitHub. Installed by the workflow's bin/wf-adopt; delete this file to opt out.
# Publishes `scripts/wf status`, the derived, read-only view of docs/workflow/ on the trusted branch,
# with each task's claim from the open pull requests, as the body of the one open issue labelled
# wf-status. The owner pins that issue once. It grants no authority and approves nothing. This workflow
# never runs candidate code: it has no pull-request trigger and acts only on the trusted branch. A
# collaborator's own workflow could still edit the issue, so it is a convenience view: check anything
# consequential against the records and pull requests. On a public repository the issue is public.
# `--pull-requests` needs a workflow pin that has it: copy this file from the release you pin.
# It runs on GitHub's runner unless the repository variable WF_GATE is `on`: then on the gate runner, labelled `wf-gate` (MAINT-0017).
name: wf-status
on:
  push:
    branches: [__TRUSTED_BRANCH__]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: wf-status
  cancel-in-progress: true
jobs:
  status:
    if: github.ref == 'refs/heads/__TRUSTED_BRANCH__'
    runs-on: ${{ vars.WF_GATE == 'on' && 'wf-gate' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Refuse any ref but exactly the trusted branch
        # GitHub compares strings ignoring case, so the job's `if:` also passes a run on a branch named `MAIN`. Checked
        # exactly here, before anything is checked out (MAINT-0017 v2.5.1 review).
        run: '[ "$GITHUB_REF" = "refs/heads/__TRUSTED_BRANCH__" ] || { echo "::error::This runs only on __TRUSTED_BRANCH__."; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # readiness previews check each task's recorded revisions against the history
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: List the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr list --state open --limit 500 --json number,title,headRefName,author,isDraft,isCrossRepository,reviewDecision > "$RUNNER_TEMP/pull-requests.json"
      - name: Fetch the pinned workflow
        # Into the cache scripts/wf reads. A private workflow repository needs a read-only token for it in the secret
        # WF_READ_TOKEN (MAINT-0017); only this step uses it, and any account that can push can read it.
        env:
          WF_READ_TOKEN: ${{ secrets.WF_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$WF_READ_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WF_READ_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_VALUE_0
          fi
          pin="$(node -e '
            const w = JSON.parse(require("fs").readFileSync("docs/workflow/config.json", "utf8")).workflow ?? {};
            if (!/^[\w.-]+\/[\w.-]+$/.test(w.repo ?? "") || !/^[0-9a-f]{40}$|^[0-9a-f]{64}$/.test(w.revision ?? "")) { console.error("wf: the config needs workflow.repo and a full workflow.revision"); process.exit(2); }
            console.log(w.repo, w.revision)')"
          read -r REPO REV <<< "$pin"
          git init -q .cache/agent-workflow
          git -C .cache/agent-workflow fetch -q --depth 1 "https://github.com/$REPO.git" "$REV"
          git -C .cache/agent-workflow checkout -q --detach FETCH_HEAD
      - name: Render the status view
        run: scripts/wf status --baseline "$GITHUB_SHA" --candidate "$GITHUB_SHA" --pull-requests "$RUNNER_TEMP/pull-requests.json" > "$RUNNER_TEMP/view.md"
      - name: Publish the status issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/status.md"
          {
            echo "_Updated automatically from \`$GITHUB_REF_NAME\` on $(date -u '+%Y-%m-%d %H:%M UTC') by \`.github/workflows/wf-status.yml\`. Each run replaces this text, so do not edit it._"
            echo
            cat "$RUNNER_TEMP/view.md"
            echo
            echo "History: [merged pull requests]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pulls?q=is%3Apr+is%3Amerged)"
          } > "$body"
          # An issue body holds at most 65,536 characters: cut at a line boundary well before that.
          node -e 'const fs = require("fs"), f = process.argv[1], t = fs.readFileSync(f, "utf8");
            if (t.length > 60000) fs.writeFileSync(f, t.slice(0, t.lastIndexOf("\n", 60000)) + "\n\n_Truncated: run `scripts/wf status` for the full view._\n");' "$body"
          number="$(gh issue list --state open --label wf-status --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
          else
            gh label create wf-status --force --color BFD4F2 --description 'Project status from wf status, updated automatically'
            gh issue create --title 'Project status' --label wf-status --body-file "$body"
          fi
