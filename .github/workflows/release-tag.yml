# Tags a release when the version in package.json reaches main without its tag (IDEA-18). The owner's merge of the
# pull request that bumps the version is the release approval, so nobody types a tag command afterwards. It acts only
# on pushes to main, never on pull requests, and writes nothing but the one tag.
name: release-tag
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-tag
  cancel-in-progress: false
jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the tag goes on the commit that last changed package.json
      - name: Tag the version if it has no tag yet
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "package.json version $version is not a release; nothing to tag"; exit 0; }
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "$tag already exists"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The commit that set the version, not merely the newest push: a run that GitHub drops or delays while later
          # merges land still tags the right commit.
          target="$(git log -1 --format=%H "$GITHUB_SHA" -- package.json)"
          git tag -a "$tag" "$target" -m "$tag: $(git log -1 --format=%s "$target"). Tagged by .github/workflows/release-tag.yml after ${GITHUB_ACTOR} merged to main."
          git push origin "refs/tags/$tag" || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
          echo "tagged $tag at $target"
