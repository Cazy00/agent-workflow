{
  "schema_version": "1.0",
  "preset": {
    "id": "agent-workflow",
    "name": "Agent workflow planning",
    "version": "0.1.0",
    "description": "Experimental native-ledger planning adapter",
    "author": "agent-workflow",
    "repository": "https://github.com/Cazy00/agent-workflow",
    "license": "MIT"
  },
  "requires": {
    "speckit_version": "==1.0.12"
  },
  "provides": {
    "templates": [
      {
        "type": "command",
        "name": "speckit.constitution",
        "file": "commands/speckit.constitution.md",
        "description": "Native workflow constitution boundary",
        "replaces": "speckit.constitution"
      },
      {
        "type": "command",
        "name": "speckit.specify",
        "file": "commands/speckit.specify.md",
        "description": "Native workflow specify boundary",
        "replaces": "speckit.specify"
      },
      {
        "type": "command",
        "name": "speckit.clarify",
        "file": "commands/speckit.clarify.md",
        "description": "Native workflow clarify boundary",
        "replaces": "speckit.clarify"
      },
      {
        "type": "command",
        "name": "speckit.plan",
        "file": "commands/speckit.plan.md",
        "description": "Native workflow plan boundary",
        "replaces": "speckit.plan"
      },
      {
        "type": "command",
        "name": "speckit.tasks",
        "file": "commands/speckit.tasks.md",
        "description": "Native workflow tasks boundary",
        "replaces": "speckit.tasks"
      },
      {
        "type": "command",
        "name": "speckit.implement",
